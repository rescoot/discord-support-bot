id: official-app
aliases: [unu-app, app-server, server-down, abschaltung, registrieren, login, unustasis, stasis, stasis-for-unu, emco-app]
title:
  de: "Welche App nutze ich noch?"
  en: "Which app do I still use?"
body:
  de: |
    Die alte unu-App geht noch, solange du auf deinem aktuellen Handy verbunden und eingeloggt bist. Bei einem Handywechsel oder einer Neuinstallation klappt das Login aber nicht mehr — die Server sind seit unus Pleite aus.

    Solange das alte Setup noch läuft, **jetzt umsteigen** ist die sichere Variante. **stasis for unu** (früher unustasis) ist die Community-App für den Roller, ohne Cloud, reine BLE-Verbindung:

    - Android: <https://play.google.com/store/apps/details?id=de.freal.unustasis&hl=de>
    - iOS: <https://apps.apple.com/de/app/stasis-for-unu/id6497332566>
    - Quellcode: <https://github.com/reunu/unustasis>

    Die App spricht den Roller lokal über Bluetooth an, kein Login, kein Internet (siehe `/faq app-connect`). Wenn du noch in der alten Original-App steckst: deinstallieren, stasis for unu installieren, fertig. Der alte Account bringt dir nichts mehr — die SIM im Roller ist seit Server-Abschaltung ohnehin tot.
  en: |
    The original unu app still works as long as you're already logged in and paired on your current phone. Switch phones or reinstall and the login won't go through any more — the servers have been off since unu's bankruptcy.

    While the old setup still runs, **switch now** is the safe move. **stasis for unu** (formerly unustasis) is the community app for the scooter — cloud-free, BLE-only:

    - Android: <https://play.google.com/store/apps/details?id=de.freal.unustasis&hl=en>
    - iOS: <https://apps.apple.com/app/stasis-for-unu/id6497332566>
    - Source: <https://github.com/reunu/unustasis>

    The app talks to the scooter locally over Bluetooth, no login, no internet (see `/faq app-connect`). If you're still on the original app: uninstall, install stasis for unu, done. Your old account is worth nothing anyway — the SIM in the scooter has been dead since the servers went off.
