id: steering-head
aliases: [lenkkopf, lenkkopflager, steuerkopflager, lenker-spiel, lenkerspiel]
title:
  de: "Lenkkopflager hat Spiel"
  en: "Play in the steering head bearing"
body:
  de: |
    Tritt beim Pro gern kurz nach der 500-km-Inspektion auf und
    ist kein Drama.

    **Test:** Vorderbremse ziehen und den Roller im Stand vor und
    zurück wiegen. Spürst du dabei ein Klacken oder Spiel im
    Lenkkopf, ist es das Lager.

    **Nachstellen:**
    1. Vordere Verkleidung ab, mehr muss nicht runter.
    2. Darunter sitzen zwei gegeneinander gekonterte Muttern.
       Gemessen wurden 32 mm für die kleine und 45 mm für die
       große. Mit zwei Rohrzangen geht es auch.
    3. **Erst die untere lösen**, dann die obere etwas fester
       ziehen, dann wieder gegeneinander kontern.
    4. Nicht überdrehen. Die Muttern müssen nicht bocksfest sein.
       Das Lager soll spielfrei sein und sich weiter leicht
       drehen lassen.

    Roller noch in der Gewährleistung: erst beim Verkäufer melden.
    Ein kurzes Video vom Spiel hilft dabei.
  en: |
    Shows up on the Pro shortly after the 500 km service quite
    often, and it's not a big deal.

    **Test:** pull the front brake and rock the scooter back and
    forth while standing. If you feel a clunk or play in the
    steering head, that's the bearing.

    **Adjusting it:**
    1. Front fairing off, nothing else has to come apart.
    2. Underneath sit two nuts locked against each other. Measured
       32 mm for the small one and 45 mm for the large one. Two
       pipe wrenches will do as well.
    3. **Loosen the lower one first**, then tighten the upper one
       a little, then lock them against each other again.
    4. Don't overdo it. The nuts don't need to be brutally tight.
       The bearing should be free of play and still turn easily.

    Still under warranty: tell the seller first. A short video of
    the play helps.
tags: [hardware, repair, troubleshooting]
